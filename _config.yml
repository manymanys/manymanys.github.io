title: ManyManys
description: An international network for comparative cognition research.
url: "https://manymanys.github.io"
baseurl: ""
author: Nicolás Alessandroni & Laurent Prétôt
rss-description: News and events from the ManyManys network.
excerpt_length: 50
date_format: "%B %-d, %Y"

timezone: "America/Toronto"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docs/

plugins:
  - jekyll-sitemap
