{% assign home_url = '/' | relative_url %}
{% if page.homepage %}{% assign home_url = '' %}{% endif %}
<header class="site-header">
  <div class="shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="The ManyManys home"><span class="wordmark-the">The</span>ManyManys<span class="wordmark-period" aria-hidden="true">.</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" hidden>
      <span class="menu-label">Menu</span><span class="menu-icon" aria-hidden="true"></span>
    </button>
    <nav class="primary-navigation" id="primary-navigation" aria-label="Main navigation">
      <a href="{{ home_url }}#research" {% if page.url contains "/MM1" %}aria-current="page"{% endif %}>Research</a>
      <a href="{{ home_url }}#about">About</a>
      <a href="{{ home_url }}#news">News &amp; events</a>
      <a href="{{ home_url }}#publications">Publications</a>
      <a class="nav-join" href="{{ '/getinvolved/' | relative_url }}">Get involved</a>
    </nav>
  </div>
</header>
