---
layout: research
---
<section class="shell interior-page interior-wide">
  <header class="interior-header"><h1>{{ page.title }}</h1><a class="text-link" href="{{ '/calendar/' | relative_url }}">View the calendar</a></header>
  {{ content }}
  <div class="news-grid archive-grid">
  {% for post in site.posts %}
    <article class="news-item">
      {% if post.thumbnail-img %}<a class="news-image" href="{{ post.url | relative_url }}" aria-label="{{ post.title | escape }}"><img src="{{ post.thumbnail-img | relative_url | uri_escape }}" alt="{{ post.title | escape }}" loading="lazy" width="640" height="400"></a>{% endif %}
      <p class="news-meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%b %-d, %Y' }}</time></p>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    </article>
  {% endfor %}
  </div>
</section>
