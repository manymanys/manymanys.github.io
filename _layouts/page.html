---
layout: research
---
<div class="shell interior-page {% if page.wide %}interior-wide{% endif %}">
  <header class="interior-header"><h1>{{ page.title }}</h1>{% if page.subtitle and page.subtitle != '' %}<p>{{ page.subtitle }}</p>{% endif %}</header>
  <div class="prose">
    {% for file in page.before-content %}{% include {{ file }} %}{% endfor %}
    {{ content }}
    {% for file in page.after-content %}{% include {{ file }} %}{% endfor %}
  </div>
</div>
