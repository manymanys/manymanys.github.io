---
layout: research
---
<article class="shell interior-page post-page">
  <header class="interior-header"><a class="text-link" href="{{ '/news/' | relative_url }}">News &amp; events</a><h1>{{ page.title }}</h1><p><time datetime="{{ page.date | date_to_xmlschema }}">Published {{ page.date | date: '%B %-d, %Y' }}</time></p></header>
  <div class="prose">{{ content }}</div>
  <nav class="post-navigation" aria-label="More updates">{% if page.previous.url %}<a href="{{ page.previous.url | relative_url }}">Previous update</a>{% endif %}<a href="{{ '/news/' | relative_url }}">All updates</a>{% if page.next.url %}<a href="{{ page.next.url | relative_url }}">Next update</a>{% endif %}</nav>
</article>
