<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ManyManys</title>
    <meta name="description" content="{{ page.description | default: page.subtitle | default: page.title | escape }}">
    <meta name="theme-color" content="#81b29a">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | escape }} | The ManyManys">
    <meta property="og:description" content="{{ page.description | default: page.subtitle | default: page.title | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/img/manymanys_logo.png' | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;650;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}">
    <script src="{{ '/assets/js/research.js' | relative_url }}" defer></script>
  </head>
  <body class="research-site {% if page.homepage %}is-home{% elsif page.url contains "/MM1" %}is-project{% else %}is-interior{% endif %}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include research-nav.html %}
    <main id="main" tabindex="-1">{{ content }}</main>
    {% include research-footer.html %}
  </body>
</html>
