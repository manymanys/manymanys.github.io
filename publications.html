---
layout: research
title: Publications
description: Research publications from the ManyManys network.
---
<div class="shell interior-page publications-page">
  <header class="interior-header"><h1>Publications</h1></header>
  <div class="papers">
    {% for paper in site.data.selected_publications %}
    <article class="paper" aria-labelledby="paper-{{ forloop.index }}">
      <p class="paper-year">{{ paper.year }}</p>
      <div class="paper-content">
        <p class="paper-venue">{{ paper.venue }}</p>
        <h2 id="paper-{{ forloop.index }}"><a href="{{ paper.url }}" target="_blank" rel="noopener noreferrer">{{ paper.title }}</a></h2>
        <a class="paper-read" href="{{ paper.url }}" target="_blank" rel="noopener noreferrer" aria-label="Read article: {{ paper.title | escape }}">Read article</a>
        <div class="citation-box">
          <div class="citation-toolbar"><span>APA 7</span><button class="copy-citation" type="button" aria-label="Copy citation for {{ paper.title | escape }}" data-citation="citation-{{ forloop.index }}" hidden>Copy citation</button></div>
          <p class="citation-text" id="citation-{{ forloop.index }}">{{ paper.citation }}</p>
          <span class="copy-status" role="status" aria-live="polite"></span>
        </div>
      </div>
    </article>
    {% endfor %}
  </div>
</div>
